
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Polaroid Card Spread with Navigation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #2c2c2c;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden; 
      padding: 20px;
      gap: 15px; 
    }

    /* 遮罩层 */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      position: relative; /* 为了定位翻页按钮 */
      color: #f4f1ea;
      text-align: center;
      width: 90%;
      max-width: 400px;
      padding: 30px 50px; /* 左右增加内边距，给按钮留空间 */
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(40, 40, 40, 0.95);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1.6em;
      margin-bottom: 15px;
      color: #d3a139;
      font-family: 'LXGW WenKai Mono TC', cursive;
    }

    .modal-text {
      font-size: 1em;
      line-height: 1.5;
      font-family: 'LXGW WenKai Mono TC', cursive;
    }

    .close-hint {
      margin-top: 20px;
      font-size: 0.8em;
      opacity: 0.6;
      cursor: pointer;
    }

    /* --- 新增：翻页按钮样式 --- */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #d3a139;
      font-size: 2rem;
      font-family: 'Segoe UI', sans-serif;
      cursor: pointer;
      user-select: none;
      transition: 0.3s;
      z-index: 10;
      border-radius: 50%;
    }

    .nav-btn:hover {
      background-color: rgba(211, 161, 57, 0.1);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .prev-btn { left: 5px; }
    .next-btn { right: 5px; }

    /* 容器 */
    .container {
      position: relative;
      width: 100%;
      height: 260px; 
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container .card {
      position: absolute;
      width: 140px; 
      height: 200px;
      background-color: #f4f1ea; 
      border-radius: 4px; 
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      font-weight: 700;
      font-size: 1.2rem;
      box-shadow: -1px 1px 5px rgba(0,0,0,0.15); 
      border: 1px solid #e0dcd0;
      transition: 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform-origin: 50% 100%;
      cursor: pointer;
      user-select: none;
      z-index: 10;
      overflow: hidden;
    }

    .container.spread .card {
      transform: 
        rotate(calc(var(--i) * 5deg)) 
        translate(calc(var(--i) * 65px), -20px); 
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .container.spread .card:hover {
      translate: 0 -10px; 
      z-index: 100;
      background-color: #fff;
      border-color: #d3a139;
    }

    .polaroid-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 10px 10px; 
      box-sizing: border-box;
    }

    .polaroid-img {
      width: 100%;
      height: 75%;  
      object-fit: cover;
      border: 1px solid rgba(0,0,0,0.1);
      background-color: #eee;
    }

    .polaroid-text {
      margin-top: 10px; 
      font-family: 'LXGW WenKai Mono TC', cursive;
      font-size: 1.1rem;
      color: #444;
      line-height: 1;
    }

    .reset-btn {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.3);
      color: #d3a139;
      border: 1px solid #d3a139;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.3s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .reset-btn:hover {
      background: #d3a139;
      color: #2c2c2c;
    }

    .container.spread .reset-btn {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 500px) {
      .container { transform: scale(0.9); }
      .container.spread .card {
        transform: rotate(calc(var(--i) * 4deg)) translate(calc(var(--i) * 60px), -30px); 
      }
      .modal-content { padding: 30px 40px; } /* 移动端减小内边距 */
    }

     /* --- 新增：内部页码控制器样式 --- */
    .page-controller {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      font-size: 0.9rem;
      color: #888;
      font-family: 'LXGW WenKai Mono TC', cursive;
    }

    .page-btn {
      cursor: pointer;
      padding: 2px 8px;
      border: 1px solid #555;
      border-radius: 4px;
      transition: 0.3s;
      user-select: none;
    }

    .page-btn:hover {
      border-color: #d3a139;
      color: #d3a139;
    }

    .page-indicator {
      color: #d3a139;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay">
    <div class="modal-content">

      <h1 class="modal-title" id="mTitle">TITLE</h1>
      <p class="modal-text" id="mText">Content details...</p>
      
      <!-- 【新增】内部页码控制器 -->
      <div class="page-controller" id="pageController" style="display:none;">
        <span class="page-btn" id="innerPrevBtn">上一页</span>
        <span class="page-indicator" id="pageIndicator">1 / 2</span>
        <span class="page-btn" id="innerNextBtn">下一页</span>
      </div>

      <div class="close-hint">[ 点击遮罩空白处关闭 ]</div>
    </div>
  </div>

  <div class="container" id="cardContainer">
    <div class="card" style="--i:1.5;" 
         data-title="标题" 
         data-desc="内容示例">
      <div class="polaroid-wrapper">
        <img class="polaroid-img" src=" " alt="图片4">
        <div class="polaroid-text">第四张卡片</div>
      </div>
    </div>

    <div class="card" style="--i:0.5;" 
         data-title="标题" 
         data-desc="内容示例">
      <div class="polaroid-wrapper">
        <img class="polaroid-img" src=" " alt="图片3">
        <div class="polaroid-text">第三张卡片</div>
      </div>
    </div>

    <div class="card" style="--i:-0.5;" 
         data-title="标题" 
         data-desc="内容示例">
      <div class="polaroid-wrapper">
        <img class="polaroid-img" src=" " alt="图片2">
        <div class="polaroid-text">第二张卡片</div>
      </div>
    </div>
    
    <div class="card" style="--i:-1.5;" 
        data-title="标题" 
        data-desc="内容示例 - 第一页"
        data-desc-2="内容示例 - 第二页">
      <div class="polaroid-wrapper">
        <img class="polaroid-img" src=" " alt="图片1">
        <div class="polaroid-text">第一张卡片</div>
      </div>
    </div>

    <button class="reset-btn" id="resetBtn">收起卡片</button>
  </div>

  <script>
    (function() {
      const container = document.getElementById('cardContainer');
      const overlay = document.getElementById('overlay');
      const mTitle = document.getElementById('mTitle');
      const mText = document.getElementById('mText');
      const resetBtn = document.getElementById('resetBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const modalContent = document.querySelector('.modal-content');

      // 内部翻页元素
      const pageController = document.getElementById('pageController');
      const innerPrevBtn = document.getElementById('innerPrevBtn');
      const innerNextBtn = document.getElementById('innerNextBtn');
      const pageIndicator = document.getElementById('pageIndicator');

      const cards = Array.from(document.querySelectorAll('.card'));
      
      let currentCardIndex = 0;   // 当前卡片索引
      let currentInnerPage = 1;   // 当前卡片内部页码 (1, 2, 3...)
      let totalInnerPages = 1;    // 当前卡片总页数

      // 获取卡片某一页的内容
      function getCardContent(card, page) {
        // page 1 对应 data-desc
        // page 2 对应 data-desc-2
        // page 3 对应 data-desc-3
        if (page === 1) return card.getAttribute('data-desc');
        return card.getAttribute(`data-desc-${page}`);
      }

      // 计算卡片一共有几页
      function calculateTotalPages(card) {
        let count = 1;
        while (card.hasAttribute(`data-desc-${count + 1}`)) {
          count++;
        }
        return count;
      }

      // 更新模态框显示
      function updateModalDisplay() {
        const card = cards[currentCardIndex];
        
        // 1. 设置标题 (始终不变)
        mTitle.textContent = card.getAttribute('data-title');
        
        // 2. 设置正文 (根据当前内部页码)
        const content = getCardContent(card, currentInnerPage);
        mText.innerHTML = content || "暂无内容";

        // 3. 处理页码控制器显示
        totalInnerPages = calculateTotalPages(card);
        
        if (totalInnerPages > 1) {
          pageController.style.display = 'flex';
          pageIndicator.textContent = `${currentInnerPage} / ${totalInnerPages}`;
          
          // 控制按钮显隐 (可选：也可以做成置灰)
          innerPrevBtn.style.visibility = currentInnerPage > 1 ? 'visible' : 'hidden';
          innerNextBtn.style.visibility = currentInnerPage < totalInnerPages ? 'visible' : 'hidden';
        } else {
          pageController.style.display = 'none';
        }
      }

      // 打开卡片逻辑
      function openCard(index) {
        currentCardIndex = index;
        currentInnerPage = 1; // 每次打开新卡片，重置回第1页
        updateModalDisplay();
        overlay.classList.add('active');
      }

      // 绑定卡片点击
      cards.forEach((card, index) => {
        card.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!container.classList.contains('spread')) {
            container.classList.add('spread');
          } else {
            openCard(index);
          }
        });
      });

      // --- 卡片切换 (大箭头) ---
      if(prevBtn) {
        prevBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          currentCardIndex = (currentCardIndex - 1 + cards.length) % cards.length;
          currentInnerPage = 1; // 切换卡片后重置页码
          updateModalDisplay();
        });
      }

      if(nextBtn) {
        nextBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          currentCardIndex = (currentCardIndex + 1) % cards.length;
          currentInnerPage = 1; // 切换卡片后重置页码
          updateModalDisplay();
        });
      }

      // --- 内部翻页 (小按钮) ---
      if(innerPrevBtn) {
        innerPrevBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if(currentInnerPage > 1) {
            currentInnerPage--;
            updateModalDisplay();
          }
        });
      }

      if(innerNextBtn) {
        innerNextBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if(currentInnerPage < totalInnerPages) {
            currentInnerPage++;
            updateModalDisplay();
          }
        });
      }

      // --- 其他基础逻辑 ---
      if(resetBtn) {
        resetBtn.addEventListener('click', () => {
          container.classList.remove('spread');
        });
      }

      if(overlay) {
        overlay.addEventListener('click', () => {
          overlay.classList.remove('active');
        });
        modalContent.addEventListener('click', (e) => {
            e.stopPropagation();
        });
      }
    })();
  </script>
</body>
</html>
