<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi ID Card with Details</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap');

        :root {
            /* 风格配色 */
            --bg-deep-space: #05081a;
            --bg-panel: #1a2238;
            --bg-panel-secondary: #2d3748;
            --accent-cyan: #00f0ff;
            --accent-violet: #9747FF;
            --accent-red: #ff2a6d;
            --text-primary: #e0fbfc;
            --text-secondary: #a0aec0;
            --border-lines: #4a5568;
            
            --card-width: 280px;
            --string-len: 70px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep-space);
            /* 背景网格微调 */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Exo 2', sans-serif;
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 顶部头像栏 --- */
        .avatar-bar-container {
            flex-shrink: 0;
            width: 100%;
            padding: 12px 0;
            background: rgba(5, 8, 26, 0.9);
            border-bottom: 1px solid var(--border-lines);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            z-index: 5;
            position: relative;
        }
        .avatar-bar-container::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.8;
        }
        .avatar-scroll {
            display: flex; gap: 15px; padding: 0 20px;
            overflow-x: auto; overflow-y: hidden;
            justify-content: center;
            scrollbar-width: none; 
        }
        .avatar-scroll::-webkit-scrollbar { display: none; }
        
        .avatar-item {
            flex-shrink: 0; width: 70px; height: 70px;
            background: var(--bg-panel-secondary);
            border: 1px solid var(--border-lines);
            cursor: pointer; position: relative;
            transition: all 0.3s ease;
            clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
        }
        .avatar-item img {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: opacity 0.3s;
        }
        .avatar-item:hover { border-color: var(--text-secondary); transform: translateY(-2px); }
        .avatar-item:hover img { opacity: 0.9; }
        .avatar-item.active {
            border-color: var(--accent-cyan);
            background-color: var(--bg-panel);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .avatar-item.active img { opacity: 1; }

        /* --- 舞台区域 --- */
        .stage-area {
            flex: 1; position: relative; width: 100%; min-height: 550px; 
            overflow: hidden; perspective: 1200px; display: flex; justify-content: center;
        }

        .lanyard-anchor {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 36px; height: 14px; background: var(--bg-panel-secondary);
            border: 1px solid var(--border-lines); border-top: none; border-radius: 0 0 4px 4px; z-index: 10;
        }
        .lanyard-anchor::after {
            content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; background: var(--accent-cyan); border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-cyan);
        }

        .swing-wrapper {
            position: absolute; top: 14px; left: 50%; width: var(--card-width);
            margin-left: calc(var(--card-width) / -2);
            display: flex; flex-direction: column; align-items: center;
            transform-origin: 50% 0; visibility: hidden; padding-bottom: 50px; 
        }
        .swing-wrapper.dropping {
            visibility: visible;
            animation: dropAndSwing 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .lanyard-string {
            width: 4px; height: var(--string-len);
            background: repeating-linear-gradient(0deg, #2d3748, #2d3748 4px, #1a202c 4px, #1a202c 8px);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            z-index: 5;
        }
        .lanyard-clip {
            width: 42px; height: 12px; background: #4a5568;
            border: 1px solid var(--border-lines); margin-top: -2px; z-index: 6; position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
        }

        /* --- 卡片主体 --- */
        .id-card {
            width: 100%; height: 420px; /* 稍微增加高度以容纳按钮 */
            background: rgba(26, 34, 56, 0.96);
            border: 1px solid var(--border-lines);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            position: relative; margin-top: 2px;
            display: flex; flex-direction: column;
        }
        .id-card::before {
            content: ''; position: absolute; inset: -1px;
            background: 
                linear-gradient(to right, var(--accent-cyan) 2px, transparent 2px) 0 0,
                linear-gradient(to bottom, var(--accent-cyan) 2px, transparent 2px) 0 0,
                linear-gradient(to left, var(--accent-cyan) 2px, transparent 2px) 100% 100%,
                linear-gradient(to top, var(--accent-cyan) 2px, transparent 2px) 100% 100%;
            background-size: 15px 15px; background-repeat: no-repeat;
            pointer-events: none; z-index: 20; opacity: 0.8;
        }

        .card-header-bg {
            height: 100px; background: linear-gradient(180deg, rgba(45, 55, 72, 0.3) 0%, rgba(26, 34, 56, 0) 100%);
            border-bottom: 1px dashed var(--border-lines); position: relative; width: 100%;
        }
        .card-hole {
            width: 40px; height: 6px; background: #05081a; margin: 12px auto 0;
            border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);
        }
        .card-logo {
            position: absolute; top: 15px; left: 15px; font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem; color: var(--accent-cyan); letter-spacing: 2px; opacity: 0.9;
        }

        .photo-frame {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            width: 90px; height: 90px; background: var(--bg-panel);
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); z-index: 30;
            clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .card-body {
            flex: 1; padding: 55px 25px 15px; text-align: center;
            display: flex; flex-direction: column; gap: 4px;
        }
        .student-name {
            font-family: 'Orbitron', sans-serif; color: var(--text-primary);
            font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.2); white-space: nowrap;
        }
        .student-role {
            font-family: 'Exo 2', sans-serif; font-size: 0.8rem;
            color: var(--accent-cyan); background: rgba(0, 240, 255, 0.1);
            padding: 2px 10px; border-left: 2px solid var(--accent-cyan);
            display: inline-block; margin: 4px auto 8px; text-transform: uppercase;
        }

        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px;
            text-align: left; margin-top: 10px; border-top: 1px solid var(--border-lines);
            padding-top: 15px;
        }
        .info-item { display: flex; flex-direction: column; }
        .label {
            font-family: 'Orbitron', sans-serif; font-size: 0.6rem;
            color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px;
        }
        .value {
            font-family: 'Exo 2', sans-serif; font-size: 0.85rem;
            color: var(--text-primary); font-weight: 600;
        }

        /* --- 新增：查看更多按钮 --- */
        .view-more-btn {
            margin-top: auto;
            margin-bottom: 10px;
            padding: 8px 0;
            width: 100%;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .view-more-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            letter-spacing: 2px;
        }
        .view-more-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.4), transparent);
            transition: 0.5s;
        }
        .view-more-btn:hover::before { left: 100%; }

        /* 底部条形码 */
        .barcode {
            height: 12px; width: 100%; opacity: 0.6;
            background: repeating-linear-gradient(90deg, var(--accent-cyan), var(--accent-cyan) 2px, transparent 2px, transparent 4px, var(--accent-cyan) 4px, var(--accent-cyan) 5px, transparent 5px, transparent 12px);
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        @keyframes dropAndSwing {
            0% { transform: translateY(-500px) rotateZ(-15deg); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translateY(0) rotateZ(10deg); }
            50% { transform: translateY(0) rotateZ(-6deg); }
            65% { transform: translateY(0) rotateZ(4deg); }
            80% { transform: translateY(0) rotateZ(-2deg); }
            90% { transform: translateY(0) rotateZ(1deg); }
            100% { transform: translateY(0) rotateZ(0deg); }
        }

        /* --- 模态框样式 (New) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 26, 0.85); backdrop-filter: blur(8px);
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-panel {
            width: 90%; max-width: 600px;
            background: var(--bg-panel);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
            position: relative;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column;
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
        }
        .modal-overlay.active .modal-panel { transform: scale(1) translateY(0); }

        /* 模态框角标装饰 */
        .modal-panel::after {
            content: ''; position: absolute; top: 0; right: 0;
            width: 30px; height: 30px;
            background: linear-gradient(135deg, transparent 50%, var(--accent-cyan) 50%);
            opacity: 0.5;
        }

        .modal-header {
            padding: 15px 25px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border-lines);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title {
            font-family: 'Orbitron', sans-serif; color: var(--accent-cyan);
            font-size: 1.2rem; letter-spacing: 2px;
        }
        .close-btn {
            background: transparent; border: 1px solid var(--accent-red);
            color: var(--accent-red); padding: 5px 15px; font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem; cursor: pointer; transition: 0.3s;
        }
        .close-btn:hover { background: var(--accent-red); color: #fff; }

        .modal-body {
            padding: 25px;
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.6;
            max-height: 70vh;
            overflow-y: auto;
        }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--border-lines); }

        .detail-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .detail-avatar {
            width: 100px; height: 100px; border: 2px solid var(--accent-cyan);
            flex-shrink: 0;
        }
        .detail-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .detail-info { flex: 1; }
        .detail-bio { margin-bottom: 20px; padding: 10px; background: rgba(0,0,0,0.2); border-left: 2px solid var(--accent-violet);  white-space: pre-wrap;}
        .section-title {
            font-family: 'Orbitron', sans-serif; color: var(--text-secondary);
            font-size: 0.9rem; margin-bottom: 10px; border-bottom: 1px dashed var(--border-lines);
        }

        /* 扫描线动画 */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan);
            opacity: 0; pointer-events: none; z-index: 10;
        }
        .modal-overlay.active .scan-line {
            animation: scan 1.5s ease-out forwards;
        }
        @keyframes scan {
            0% { top: 0; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .detail-row { flex-direction: column; align-items: center; text-align: center; }
            .detail-bio { text-align: left; }
        }

    </style>
</head>
<body>

    <!-- 顶部头像栏 -->
    <div class="avatar-bar-container">
        <div class="avatar-scroll" id="avatarList"></div>
    </div>

    <!-- 舞台区域 -->
    <div class="stage-area">
        <div class="lanyard-anchor"></div>
        
        <div class="swing-wrapper" id="swingWrapper">
            
            <div class="lanyard-string"></div>
            <div class="lanyard-clip"></div>
            
            <div class="id-card">
                <div class="card-header-bg">
                    <div class="card-hole"></div>
                    <div class="card-logo">P.M.A. ARCHIVE</div>
                </div>

                <div class="photo-frame">
                    <img id="cardImage" src="" alt="Avatar">
                </div>

                <div class="card-body">
                    <h2 class="student-name" id="cardName">LOADING...</h2>
                    <span class="student-role" id="cardRole">CADET</span>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">学号</span>
                            <span class="value" id="cardId">---</span>
                        </div>
                        <div class="info-item">
                            <span class="label">专业</span>
                            <span class="value" id="cardDept">---</span>
                        </div>
                        <div class="info-item">
                            <span class="label">性别/分化</span>
                            <span class="value" id="cardBlood">---</span>
                        </div>
                        <div class="info-item">
                            <span class="label">信息素</span>
                            <span class="value" id="cardLevel">---</span>
                        </div>
                    </div>

                    <!-- 新增按钮 -->
                    <button class="view-more-btn" onclick="openDetails()">
                        >> ACCESS DATA_
                    </button>

                    <div class="barcode"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-panel">
            <div class="scan-line"></div> <!-- 扫描线效果 -->
            
            <div class="modal-header">
                <span class="modal-title">PERSONNEL FILE</span>
                <button class="close-btn" onclick="closeDetails()">CLOSE [X]</button>
            </div>
            
            <div class="modal-body">
                <div class="detail-row">
                    <div class="detail-avatar">
                        <img id="detailImg" src="" alt="">
                    </div>
                    <div class="detail-info">
                        <h3 id="detailName" style="color:var(--accent-cyan); margin:0 0 5px 0;"></h3>
                        <div id="detailId" style="font-family:'Orbitron'; font-size:0.8rem; color:#aaa;"></div>
                        <div style="margin-top:10px; font-size:0.85rem; color:var(--text-secondary);">
                            " <span id="detailQuote" style="font-style:italic; color:#fff;"></span> "
                        </div>
                    </div>
                </div>

                <div class="section-title">BIOGRAPHY</div>
                <div class="detail-bio" id="detailBio"></div>

            </div>
        </div>
    </div>

    <script>
        // 扩充后的数据
        const students = [
            { 
                id: '', // 学号
                name: '', // 姓名
                role: '', // 英文名
                dept: '', // 专业
                blood: '', // 性别/分化
                level: '',// 信息素
                color: '#00f0ff', // 主题色
                avatar: '',// 头像
                // 个人简介
                bio: ``,
                // 口头禅
                quote: '',
            },
            { 
                id: '', 
                name: '', 
                role: '', 
                dept: '', 
                blood: '', 
                level: '',
                color: '#9747FF', 
                avatar: '',
                bio: ``,
                quote: '',
            },
            { 
                id: '', 
                name: '', 
                role: '', 
                dept: '', 
                blood: '', 
                level: '',
                color: '#9747FF', 
                avatar: '',
                bio: ``,
                quote: '',
            },
            { 
                id: '', 
                name: '', 
                role: '', 
                dept: '', 
                blood: '', 
                level: '',
                color: '#9747FF', 
                avatar: '',
                bio: ``,
                quote: '',
            },
            { 
                id: '', 
                name: '', 
                role: '', 
                dept: '', 
                blood: '', 
                level: '',
                color: '#9747FF', 
                avatar: '',
                bio: ``,
                quote: '',
            }
        ];

        const avatarList = document.getElementById('avatarList');
        const swingWrapper = document.getElementById('swingWrapper');
        const modalOverlay = document.getElementById('modalOverlay');
        
        // Card Elements
        const ui = {
            name: document.getElementById('cardName'),
            role: document.getElementById('cardRole'),
            id: document.getElementById('cardId'),
            dept: document.getElementById('cardDept'),
            blood: document.getElementById('cardBlood'),
            level: document.getElementById('cardLevel'),
            img: document.getElementById('cardImage')
        };

        // Modal Elements
        const modalUI = {
            img: document.getElementById('detailImg'),
            name: document.getElementById('detailName'),
            id: document.getElementById('detailId'),
            quote: document.getElementById('detailQuote'),
            bio: document.getElementById('detailBio'),
            skillContainer: document.getElementById('skillContainer')
        };

        let currentStudentIndex = 0;

        // Init Avatar List
        students.forEach((student, index) => {
            const el = document.createElement('div');
            el.className = 'avatar-item';
            el.innerHTML = `<img src="${student.avatar}" alt="${student.name}">`;
            el.onclick = () => renderCard(index);
            avatarList.appendChild(el);
        });

        function renderCard(index) {
            currentStudentIndex = index;
            const items = document.querySelectorAll('.avatar-item');
            items.forEach(i => i.classList.remove('active'));
            items[index].classList.add('active');

            swingWrapper.classList.remove('dropping');
            void swingWrapper.offsetWidth; // Trigger Reflow

            const data = students[index];
            ui.name.textContent = data.name;
            ui.role.textContent = data.role;
            ui.id.textContent = data.id;
            ui.dept.textContent = data.dept;
            ui.blood.textContent = data.blood;
            ui.level.textContent = data.level;
            ui.img.src = data.avatar;

            ui.role.style.color = data.color;
            ui.role.style.borderColor = data.color;
            ui.role.style.backgroundColor = `${data.color}1a`; 

            swingWrapper.classList.add('dropping');
        }

        // 打开详情页
        function openDetails() {
            const data = students[currentStudentIndex];
            
            modalUI.img.src = data.avatar;
            modalUI.name.textContent = data.name;
            modalUI.id.textContent = `ID: ${data.id} // ${data.role}`;
            modalUI.quote.textContent = data.quote;
            modalUI.bio.textContent = data.bio;

            modalOverlay.classList.add('active');
        }

        function closeDetails() {
            modalOverlay.classList.remove('active');
        }

        // 初始化
        window.onload = () => {
            setTimeout(() => renderCard(0), 500);
        };
    </script>
</body>
</html>
